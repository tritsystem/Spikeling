[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spikeling"
version = "1.0.2"
description = "A domain-specific language and runtime for spiking neural networks: one .spk file, four backends (Python, C, Verilog, GDScript)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Gavin Branaa", email = "gbranaa4@gmail.com" }]
requires-python = ">=3.10"
keywords = ["spiking neural network", "neuromorphic", "dsl", "lif", "stdp", "reservoir computing", "fpga"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The core Python runtime (compiler + runtime + encoder) is pure stdlib.
# The C / Verilog / GDScript backends and the ai-apps are separate and carry
# their own toolchains -- see README.md.
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/tritsystem/Spikeling"
Repository = "https://github.com/tritsystem/Spikeling"
Issues = "https://github.com/tritsystem/Spikeling/issues"
Changelog = "https://github.com/tritsystem/Spikeling/blob/main/CHANGELOG.md"

[project.scripts]
# thin wrapper over `python -m core`; that remains the canonical interface
spikeling = "core.__main__:main"

[tool.setuptools.packages.find]
include = ["core*"]

[tool.setuptools.package-data]
# .spk files are data, not Python, so setuptools drops them by default -- this
# silently broke the package's own default demo: a fresh `pip install .` had
# core/examples/*.py (the fixture/test files) but not core/examples/*.spk,
# so `spikeling --no-interactive` (and plain `spikeling`) failed with
# "file not found" on sound_localizer.spk, the file the entry point runs when
# given no argument. Reproduced in a genuinely fresh install before fixing.
core = ["examples/*.spk", "examples/**/*.spk", "stdlib/*.spk"]

[tool.setuptools]
# Loose root-level modules that other tools in this portfolio (and the new
# `spikegate` package) import directly (`from pyspike import Net`) against a
# real installed `spikeling` package, not just a local checkout on sys.path.
py-modules = ["pyspike", "pyspike_causal", "pyspike_surrogate_gradient", "pyspike_neuron_models"]
