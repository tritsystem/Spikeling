name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (editable + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Runtime smoke — compile + run the default .spk network
        run: |
          python -m core --no-interactive

      - name: Console script resolves
        run: |
          spikeling --no-interactive

      - name: Pure-logic parity tests
        run: |
          python -m pytest -q \
            test_pyspike_encoding.py \
            test_pyspike_orchestrator_parity.py \
            test_pyspike_scheduler_parity.py \
            test_pyspike_incremental_parity.py \
            test_pyspike_soft_conflicts_parity.py

      - name: Full collection (non-blocking — many suites need optional hardware/model deps)
        run: |
          python -m pytest -q --collect-only || true
